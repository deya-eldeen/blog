<svg class="cover-art" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pt-bg" cx="50%" cy="38%" r="80%">
      <stop offset="0" stop-color="#2a2150"/>
      <stop offset="1" stop-color="#0b0b1a"/>
    </radialGradient>
    <pattern id="pt-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8f86d9" opacity=".18"/>
    </pattern>
    <linearGradient id="pt-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211c3d"/>
      <stop offset="1" stop-color="#15132a"/>
    </linearGradient>
    <filter id="pt-glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="pt-shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="url(#pt-bg)"/>
  <rect width="640" height="400" fill="url(#pt-dots)"/>
  <g transform="translate(0 18)">

  <!-- The type: Tagged<Meters, Double>, with the phantom parameter drawn as a ghostly slot -->
  <g filter="url(#pt-shadow)">
    <rect x="56" y="62" width="528" height="150" rx="22" fill="url(#pt-card)" stroke="#3b3466" stroke-width="2"/>
  </g>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="34" font-weight="600">
    <text x="84" y="150" fill="#e9e6ff">Tagged&lt;</text>
    <rect x="226" y="108" width="150" height="58" rx="14" fill="#b9a8ff" opacity=".22" filter="url(#pt-glow)"/>
    <rect x="226" y="108" width="150" height="58" rx="14" fill="#b9a8ff" fill-opacity=".07" stroke="#c7b9ff" stroke-width="2.5" stroke-dasharray="8 7"/>
    <text x="240" y="150" fill="#d8ceff" opacity=".7">Meters</text>
    <text x="384" y="150" fill="#e9e6ff">, Double&gt;</text>
  </g>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="15">
    <path d="M301 104 v-14" stroke="#c7b9ff" stroke-width="2" stroke-dasharray="3 4" opacity=".8"/>
    <text x="301" y="84" text-anchor="middle" fill="#c7b9ff">compile time only</text>
    <path d="M476 170 v14" stroke="#7fdbca" stroke-width="2"/>
    <text x="476" y="200" text-anchor="middle" fill="#7fdbca">8 bytes at runtime</text>
  </g>

  <!-- Identifiers that can't be swapped -->
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="20" font-weight="600">
    <rect x="56" y="262" width="138" height="48" rx="24" fill="#ff8a3d" fill-opacity=".14" stroke="#ff8a3d" stroke-width="2.5"/>
    <text x="125" y="293" text-anchor="middle" fill="#ffc29a">User.ID</text>
    <rect x="300" y="262" width="150" height="48" rx="24" fill="#4f9cf0" fill-opacity=".14" stroke="#4f9cf0" stroke-width="2.5"/>
    <text x="375" y="293" text-anchor="middle" fill="#a9cdf7">Order.ID</text>
  </g>
  <path d="M206 276 C 230 250, 268 250, 290 272" fill="none" stroke="#8a84b3" stroke-width="3" stroke-linecap="round"/>
  <path d="M282 262 l10 11 -14 3" fill="none" stroke="#8a84b3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M290 298 C 266 322, 228 322, 206 300" fill="none" stroke="#8a84b3" stroke-width="3" stroke-linecap="round"/>
  <path d="M214 310 l-10 -11 14 -3" fill="none" stroke="#8a84b3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="248" cy="286" r="17" fill="#2a1830" stroke="#ff5a6a" stroke-width="3"/>
  <path d="M241 279 l14 14 M255 279 l-14 14" stroke="#ff5a6a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Typestate: only valid transitions exist -->
  <path d="M494 286 h34 M548 286 h34" stroke="#c7b9ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7"/>
  <circle cx="484" cy="286" r="12" fill="none" stroke="#c7b9ff" stroke-width="3" opacity=".75"/>
  <circle cx="538" cy="286" r="12" fill="none" stroke="#c7b9ff" stroke-width="3" opacity=".75"/>
  <circle cx="592" cy="286" r="18" fill="#7fdbca" fill-opacity=".18" stroke="#7fdbca" stroke-width="3"/>
  <path d="M584 286 l6 6 11 -12" fill="none" stroke="#7fdbca" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
