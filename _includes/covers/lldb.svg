<svg class="cover-art" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="lldb-bg" cx="35%" cy="30%" r="85%">
      <stop offset="0" stop-color="#1d2b4f"/>
      <stop offset="1" stop-color="#090e1c"/>
    </radialGradient>
    <linearGradient id="lldb-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232b3d"/>
      <stop offset="1" stop-color="#151a27"/>
    </linearGradient>
    <linearGradient id="lldb-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="lldb-lens" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#9ab8ff" stop-opacity=".04"/>
    </radialGradient>
    <linearGradient id="lldb-cable" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f86d9"/>
      <stop offset="1" stop-color="#2a5fa8"/>
    </linearGradient>
    <filter id="lldb-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="lldb-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <clipPath id="lldb-lens-clip"><circle cx="300" cy="172" r="62"/></clipPath>
  </defs>

  <rect width="640" height="400" fill="url(#lldb-bg)"/>
  <ellipse cx="300" cy="350" rx="250" ry="18" fill="#000" opacity=".22"/>

  <g filter="url(#lldb-shadow)">
    <rect x="44" y="40" width="430" height="292" rx="22" fill="url(#lldb-window)" stroke="#39445e" stroke-width="2"/>
  </g>
  <circle cx="74" cy="64" r="7" fill="#ff5f57"/>
  <circle cx="96" cy="64" r="7" fill="#febc2e"/>
  <circle cx="118" cy="64" r="7" fill="#28c840"/>
  <line x1="44" y1="84" x2="474" y2="84" stroke="#2f384d" stroke-width="2"/>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="17">
    <g fill="#5d6884">
      <text x="72" y="114">10</text>
      <text x="72" y="146">11</text>
      <text x="72" y="210">13</text>
      <text x="72" y="242">14</text>
      <text x="72" y="274">15</text>
    </g>
    <text x="72" y="178" fill="#ffb27a">12</text>

    <rect x="104" y="157" width="356" height="30" rx="5" fill="url(#lldb-line)"/>
    <circle cx="58" cy="172" r="11" fill="#ff5a4d" filter="url(#lldb-glow)" opacity=".8"/>
    <circle cx="58" cy="172" r="6" fill="#ff5a4d"/>

    <text x="122" y="114"><tspan fill="#c792ea">var</tspan><tspan fill="#d6deeb"> sum = </tspan><tspan fill="#f78c6c">0</tspan></text>
    <text x="122" y="146"><tspan fill="#c792ea">for</tspan><tspan fill="#d6deeb"> value </tspan><tspan fill="#c792ea">in</tspan><tspan fill="#d6deeb"> values {</tspan></text>
    <text x="150" y="178" fill="#ffd5b0">sum += value</text>
    <text x="122" y="210" fill="#d6deeb">}</text>
    <text x="122" y="242"><tspan fill="#c792ea">return</tspan><tspan fill="#d6deeb"> sum</tspan></text>

    <text x="72" y="310" fill="#7fdbca">(lldb)</text>
    <text x="146" y="310" fill="#d6deeb">po sum</text>
    <rect x="216" y="294" width="10" height="20" fill="#7fdbca"/>
  </g>

  <path d="M474 150 h18 a14 14 0 0 1 14 14 v20 a14 14 0 0 1 -14 14 h-18" fill="#2a3245" stroke="#ff8a3d" stroke-width="3"/>
  <rect x="470" y="146" width="16" height="56" rx="6" fill="#ff8a3d" filter="url(#lldb-glow)" opacity=".55"/>
  <path d="M506 174 C 560 174, 586 120, 556 96 C 528 74, 506 110, 540 128 C 590 154, 610 210, 578 252" fill="none" stroke="url(#lldb-cable)" stroke-width="14" stroke-linecap="round"/>
  <g transform="translate(578 290)">
    <rect x="-46" y="-40" width="92" height="80" rx="20" fill="#16203a" stroke="#3f86d9" stroke-width="3"/>
    <text y="10" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" font-weight="700"><tspan fill="#5ea0ef">&gt;&gt;</tspan><tspan fill="#ffd34d">&gt;</tspan></text>
  </g>

  <g clip-path="url(#lldb-lens-clip)">
    <rect x="230" y="100" width="140" height="150" fill="#1b2232"/>
    <rect x="236" y="148" width="134" height="48" rx="8" fill="#ff8a3d" opacity=".28"/>
    <text x="212" y="183" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" fill="#ffe2c8">sum += value</text>
    <circle cx="300" cy="172" r="62" fill="url(#lldb-lens)"/>
  </g>
  <circle cx="300" cy="172" r="64" fill="none" stroke="#ff8a3d" stroke-width="3" filter="url(#lldb-glow)" opacity=".7"/>
  <circle cx="300" cy="172" r="64" fill="none" stroke="#c8d2e6" stroke-width="9"/>
  <circle cx="300" cy="172" r="64" fill="none" stroke="#6c7891" stroke-width="2"/>
  <path d="M276 132 a46 46 0 0 1 42 -6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  <path d="M348 222 l52 56" stroke="#ff8a3d" stroke-width="22" stroke-linecap="round"/>
  <path d="M358 233 l62 68" stroke="#1c2130" stroke-width="20" stroke-linecap="round"/>
  <path d="M360 236 l56 62" stroke="#2f3649" stroke-width="10" stroke-linecap="round"/>
</svg>
