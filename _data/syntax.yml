light:
  base00: "#3d434d" # soft slate — code block background
  base01: "#48515d" # lighter slate — panel/line-number gutter
  base02: "#314549" # muted teal — selection highlight
  base03: "#b0bdce" # pale gray — comments/doc text
  base04: "#b2ccd6" # pale steel — subtle UI lines/numbers
  base05: "#eeffff" # icy white — punctuation/default text
  base06: "#eeffff" # icy white — light highlight background
  base07: "#ffffff" # white — primary foreground text
  base08: "#f07178" # salmon — operators/tags/deleted diff
  base09: "#f78c6c" # coral — classes/bold markup/search hits
  base0a: "#ffcb6b" # amber — strings/inline code/inserted diff
  base0b: "#98c379" # soft green — functions/method names
  base0c: "#89ddff" # bright cyan — support/regex/quotes
  base0d: "#82aaff" # sky blue — keywords/storage types
  base0e: "#c792ea" # lilac — constants/booleans/links
  base0f: "#ff5370" # vivid pink — deprecated/error markers

dark:
  base00: "#252d39" # soft navy — code block background
  base01: "#303b49" # lighter navy — panel/line-number gutter
  base02: "#1f2933" # muted charcoal — selection highlight
  base03: "#a3b1c3" # cool gray — comments/doc text
  base04: "#9fb0c0" # soft steel — subtle UI lines/numbers
  base05: "#cdd9e5" # pale blue-gray — punctuation/default text
  base06: "#e5edf5" # light mist — light highlight background
  base07: "#f8fbff" # off-white — primary foreground text
  base08: "#ff6b6b" # coral — operators/delimiters/deleted diff
  base09: "#ffae42" # amber — numbers/booleans/metadata
  base0a: "#ffd166" # warm yellow — strings/inline code/inserted diff
  base0b: "#7ee787" # bright green — functions/method names
  base0c: "#63d2ff" # cyan — types/generics/attributes
  base0d: "#7aa2ff" # indigo-blue — Swift keywords/control flow
  base0e: "#b48ef6" # lavender — constants/enums/annotations
  base0f: "#ff66c4" # hot pink — warnings/deprecated/error markers
